name: Bug report
description: Something in the viewer is broken or behaves differently than documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in what you can — the fields below are the ones that usually decide whether a bug is reproducible.
        Before filing, check the three wheel modes **Auto / Zoom / Pan** in the viewer footer, and reload the page after installing or updating.

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `package.json`, the Plugins page, or `npm ls dsh-image-zoom`.
      placeholder: 1.0.1
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Desktop app version or `dsh --version`.
      placeholder: 0.2.1-rc.5
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS — DSH Desktop
        - macOS — dsh web
        - Windows — DSH Desktop
        - Windows — dsh web
        - Linux — dsh web
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: input
    attributes:
      label: Input device
      multiple: true
      options:
        - Trackpad (pinch)
        - Trackpad (two-finger scroll)
        - Mouse wheel
        - Magic Mouse / smooth-scroll mouse
        - Touch screen
        - Keyboard
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where did the image come from?
      options:
        - Markdown image in a message
        - Attachment (`blob:` URL)
        - Tool result / `read_image`
        - Workspace file (`/api/file?path=…`)
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a conversation with an image
        2. Click the image
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshot or screen recording, console errors, and the exact image URL if it is safe to share.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release and the DSH version is inside `engines.dsh`.
          required: true
        - label: I reloaded the page (or restarted DSH) after installing or updating the plugin.
          required: true
        - label: I did not include tokens, API keys, or private image contents in this report.
          required: true
