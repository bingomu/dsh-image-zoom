name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Start headless Chrome
        run: ./tests/chrome.sh

      - name: Interaction tests
        run: node tests/run-e2e.mjs

      - name: Stop headless Chrome
        if: always()
        run: ./tests/chrome.sh stop
